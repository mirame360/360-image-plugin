<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>360 Image Player Demo</title>
    <!-- Load Pannellum directly from CDN for demo purposes -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #0f172a;
        color: white;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .header {
        padding: 1rem 2rem;
        background: rgba(255,255,255,0.05);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .header h1 {
        margin: 0;
        font-size: 1.25rem;
      }
      .controls {
        display: flex;
        gap: 1rem;
      }
      button {
        background: #3b82f6;
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.2s;
      }
      button:hover {
        background: #2563eb;
      }
      #viewer {
        flex: 1;
        width: 100%;
      }
      #snapshot-result {
        position: fixed;
        bottom: 20px;
        right: 20px;
        max-width: 300px;
        background: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        display: none;
      }
      #snapshot-result img {
        width: 100%;
        display: block;
      }
      #snapshot-result .caption {
        padding: 8px;
        color: #1e293b;
        font-size: 12px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>@mirame360/360-image-player</h1>
      <div class="controls">
        <button id="btn-snapshot">Take Snapshot</button>
      </div>
    </div>
    
    <div id="viewer"></div>

    <div id="snapshot-result">
      <img id="snapshot-img" src="" alt="Snapshot" />
      <div class="caption">Snapshot ready!</div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
