<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>360 Image Player Demo</title>
    <!-- Load Pannellum directly from CDN for demo purposes -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #0f172a;
        color: white;
        display: flex;
        flex-direction: column;
        height: 100vh;
        position: relative;
      }
      .header {
        padding: 1rem 2rem;
        background: rgba(255,255,255,0.05);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .header h1 {
        margin: 0;
        font-size: 1.25rem;
      }
      .controls {
        display: flex;
        gap: 1rem;
        align-items: center;
      }
      button {
        background: #3b82f6;
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.2s, transform 0.1s;
      }
      button:hover {
        background: #2563eb;
      }
      button:active {
        transform: scale(0.98);
      }
      .btn-upload {
        background: #10b981;
        color: white;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.2s, transform 0.1s;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }
      .btn-upload:hover {
        background: #059669;
      }
      .btn-upload:active {
        transform: scale(0.98);
      }
      #file-upload {
        display: none;
      }
      #viewer {
        flex: 1;
        width: 100%;
      }
      #snapshot-result {
        position: fixed;
        bottom: 20px;
        right: 20px;
        max-width: 300px;
        background: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        display: none;
      }
      #snapshot-result img {
        width: 100%;
        display: block;
      }
      #snapshot-result .caption {
        padding: 8px;
        color: #1e293b;
        font-size: 12px;
        text-align: center;
      }
      .filters-panel {
        position: absolute;
        top: 80px;
        right: 20px;
        width: 280px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 1.25rem;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
        user-select: none;
      }
      .panel-title {
        font-size: 0.95rem;
        font-weight: 700;
        margin: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 0.5rem;
      }
      .panel-title button.reset-btn {
        background: transparent;
        color: #3b82f6;
        border: none;
        padding: 0;
        font-size: 0.8rem;
        cursor: pointer;
        font-weight: 600;
        transition: color 0.2s;
      }
      .panel-title button.reset-btn:hover {
        color: #60a5fa;
        background: transparent;
      }
      .filter-group {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }
      .filter-label {
        font-size: 0.78rem;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.7);
        display: flex;
        justify-content: space-between;
      }
      .filter-value {
        color: #3b82f6;
        font-family: monospace;
      }
      input[type="range"] {
        -webkit-appearance: none;
        width: 100%;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        outline: none;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #3b82f6;
        cursor: pointer;
        transition: transform 0.1s;
      }
      input[type="range"]::-webkit-slider-thumb:hover {
        transform: scale(1.2);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>@mirame360/360-image-player</h1>
      <div class="controls">
        <label for="file-upload" class="btn-upload">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="feather feather-upload"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          Upload 360° Image
        </label>
        <input type="file" id="file-upload" accept="image/*" />
        <button id="btn-snapshot">Take Snapshot</button>
      </div>
    </div>
    
    <div id="viewer"></div>

    <div class="filters-panel">
      <div class="panel-title">
        <span>Color Adjustments</span>
        <button id="btn-reset" class="reset-btn">Reset All</button>
      </div>
      
      <div class="filter-group">
        <div class="filter-label">
          <span>Exposure</span>
          <span id="val-exposure" class="filter-value">0.00</span>
        </div>
        <input type="range" id="filter-exposure" min="-2" max="2" step="0.05" value="0" />
      </div>

      <div class="filter-group">
        <div class="filter-label">
          <span>Brightness</span>
          <span id="val-brightness" class="filter-value">0.00</span>
        </div>
        <input type="range" id="filter-brightness" min="-1" max="1" step="0.05" value="0" />
      </div>

      <div class="filter-group">
        <div class="filter-label">
          <span>Contrast</span>
          <span id="val-contrast" class="filter-value">1.00</span>
        </div>
        <input type="range" id="filter-contrast" min="0" max="3" step="0.05" value="1" />
      </div>

      <div class="filter-group">
        <div class="filter-label">
          <span>Saturation</span>
          <span id="val-saturation" class="filter-value">1.00</span>
        </div>
        <input type="range" id="filter-saturation" min="0" max="3" step="0.05" value="1" />
      </div>

      <div class="filter-group">
        <div class="filter-label">
          <span>Temperature</span>
          <span id="val-temperature" class="filter-value">0.00</span>
        </div>
        <input type="range" id="filter-temperature" min="-1" max="1" step="0.05" value="0" />
      </div>

      <div class="filter-group">
        <div class="filter-label">
          <span>Tint</span>
          <span id="val-tint" class="filter-value">0.00</span>
        </div>
        <input type="range" id="filter-tint" min="-1" max="1" step="0.05" value="0" />
      </div>

      <div class="filter-group">
        <div class="filter-label">
          <span>Highlights</span>
          <span id="val-highlight" class="filter-value">0.00</span>
        </div>
        <input type="range" id="filter-highlight" min="-1" max="1" step="0.05" value="0" />
      </div>

      <div class="filter-group">
        <div class="filter-label">
          <span>Shadows</span>
          <span id="val-shadow" class="filter-value">0.00</span>
        </div>
        <input type="range" id="filter-shadow" min="-1" max="1" step="0.05" value="0" />
      </div>
    </div>

    <div id="snapshot-result">
      <img id="snapshot-img" src="" alt="Snapshot" />
      <div class="caption">Snapshot ready!</div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
